<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Henderson–Hasselbalch equation and pH vs ratio</title>
  <desc id="desc2">Top: the Henderson-Hasselbalch equation. Bottom: a graph showing how pH changes with log10([A⁻]/[HA]) ratio, with key points marked at ratio 0.1, 1, and 10.</desc>
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6faf9"/>
      <stop offset="100%" stop-color="#e8f4f2"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d6a65" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="350" fill="url(#bgGrad2)"/>
  
  <!-- Equation box -->
  <g transform="translate(40,20)" filter="url(#shadow2)">
    <rect x="0" y="0" width="520" height="140" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/>
    <text x="260" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#0d6a65">Henderson–Hasselbalch Equation</text>
    <line x1="40" y1="48" x2="480" y2="48" stroke="#c9d6d4" stroke-width="1"/>
    
    <!-- Equation -->
    <text x="260" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#15242a">
      pH = pKₐ + log₁₀( [A⁻] / [HA] )
    </text>
    
    <!-- Annotations -->
    <g font-family="system-ui,sans-serif" font-size="12" fill="#55676e">
      <text x="60" y="122">pKₐ = −log₁₀(Kₐ)</text>
      <text x="260" y="122" text-anchor="middle">[A⁻] = conjugate base concentration</text>
      <text x="480" y="122" text-anchor="end">[HA] = weak acid concentration</text>
    </g>
  </g>
  
  <!-- Graph: pH vs ratio -->
  <g transform="translate(40,180)" filter="url(#shadow2)">
    <rect x="0" y="0" width="520" height="150" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/>
    <text x="260" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0d6a65">pH = pKₐ + log₁₀(ratio)  (ratio = [A⁻]/[HA])</text>
    
    <!-- Axes -->
    <g stroke="#55676e" stroke-width="1.5">
      <!-- Y axis -->
      <line x1="60" y1="120" x2="60" y2="30"/>
      <!-- X axis -->
      <line x1="60" y1="120" x2="480" y2="120"/>
      <!-- Arrow heads -->
      <path d="M55,35 L60,30 L65,35" fill="#55676e"/>
      <path d="M475,115 L480,120 L475,125" fill="#55676e"/>
    </g>
    
    <!-- Y axis labels -->
    <g font-family="system-ui,sans-serif" font-size="11" fill="#55676e" text-anchor="end">
      <text x="55" y="35">pKₐ + 2</text>
      <text x="55" y="57">pKₐ + 1</text>
      <text x="55" y="79">pKₐ</text>
      <text x="55" y="101">pKₐ − 1</text>
      <text x="55" y="123">pKₐ − 2</text>
    </g>
    
    <!-- Grid lines -->
    <g stroke="#e8f4f2" stroke-width="1">
      <line x1="60" y1="57" x2="480" y2="57"/>   <!-- pKa+1 -->
      <line x1="60" y1="79" x2="480" y2="79" stroke="#d7f0dc" stroke-width="2"/>  <!-- pKa -->
      <line x1="60" y1="101" x2="480" y2="101"/>
    </g>
    
    <!-- X axis labels (log scale) -->
    <g font-family="system-ui,sans-serif" font-size="11" fill="#55676e" text-anchor="middle">
      <text x="80" y="138">0.01</text>
      <text x="140" y="138">0.1</text>
      <text x="220" y="138">1</text>
      <text x="320" y="138">10</text>
      <text x="420" y="138">100</text>
      <text x="490" y="138" font-size="10">[A⁻]/[HA]</text>
    </g>
    
    <!-- Tick marks -->
    <g stroke="#55676e" stroke-width="1">
      <line x1="80" y1="120" x2="80" y2="125"/>
      <line x1="140" y1="120" x2="140" y2="125"/>
      <line x1="220" y1="120" x2="220" y2="125" stroke-width="2"/>
      <line x1="320" y1="120" x2="320" y2="125"/>
      <line x1="420" y1="120" x2="420" y2="125"/>
    </g>
    
    <!-- Curve: pH = pKa + log10(ratio) -->
    <!-- x: 60 to 480 maps to log10(ratio) from -2 to +2 -->
    <!-- y: 120 - 22.5 * log10(ratio) -->
    <path d="M 60,120 
             C 80,101 110,85 140,79
             C 180,75 200,77 220,79
             C 260,82 300,84 320,85
             C 380,87 440,89 480,91" 
          fill="none" stroke="#0d6a65" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Key points -->
    <g>
      <!-- Ratio 0.1 -->
      <circle cx="140" cy="79" r="6" fill="#ff6b6b" stroke="#c0392b" stroke-width="2"/>
      <text x="140" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c0392b" font-weight="600">ratio 0.1</text>
      <text x="140" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#55676e">pH = pKₐ − 1</text>
      
      <!-- Ratio 1 -->
      <circle cx="220" cy="79" r="8" fill="#4ecdc4" stroke="#0d6a65" stroke-width="3"/>
      <text x="220" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#0d6a65" font-weight="600">ratio 1 (best buffer)</text>
      <text x="220" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#0d6a65" font-weight="bold">pH = pKₐ</text>
      
      <!-- Ratio 10 -->
      <circle cx="320" cy="85" r="6" fill="#ff6b6b" stroke="#c0392b" stroke-width="2"/>
      <text x="320" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c0392b" font-weight="600">ratio 10</text>
      <text x="320" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#55676e">pH = pKₐ + 1</text>
    </g>
    
    <!-- Effective buffer range bracket -->
    <path d="M 140,125 L 140,130 L 320,130 L 320,125" fill="none" stroke="#0d6a65" stroke-width="2"/>
    <text x="230" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0d6a65" font-weight="600">Effective buffer range: pKₐ ± 1</text>
  </g>
</svg>